services:
  legacy-db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${LEGACY_DB_NAME}
      MYSQL_USER:          ${LEGACY_DB_USER}
      MYSQL_PASSWORD:      ${LEGACY_DB_PASSWORD}
    volumes:
      - ./legacy/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./legacy/sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - legacy-db-data:/var/lib/mysql
    networks:
      - legacy-internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    user: "999:999"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  legacy-app:
    build: ./legacy
    environment:
      DB_HOST: legacy-db
      DB_PORT: "3306"
      DB_NAME: ${LEGACY_DB_NAME}
      DB_USER: ${LEGACY_DB_USER}
      DB_PASS: ${LEGACY_DB_PASSWORD}
    volumes:
      - ./legacy/src:/var/www/html:ro
    networks:
      - legacy-internal
    dns:
      - "127.0.0.1"
    depends_on:
      legacy-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    user: "1000:1000"

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8056:8080"
    networks:
      - legacy-internal
      - legacy-api
    depends_on:
      legacy-app:
        condition: service_started
        restart: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  legacy-internal:
    driver: bridge
    internal: true
  legacy-api:
    driver: bridge

volumes:
  legacy-db-data: